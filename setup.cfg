[metadata]
name = dataset-converter
version = 0.1.0
description = Dataset conversion utilities for HDF5/Xperience and Nymeria motion data.
long_description = file: README.md
long_description_content_type = text/markdown

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.11
install_requires =
    h5py
    numpy
    scipy
    tqdm

[options.packages.find]
where = src
include =
    dataset_converter*
    soma*

[options.entry_points]
console_scripts =
    dataset-converter-hdf5-batch = dataset_converter.hdf5.cli.batch_export:main
    dataset-converter-nymeria-batch = dataset_converter.nymeria.cli.batch_export:main
    dataset-converter-nymeria-viewer = dataset_converter.visualization.nymeria_rerun:main

[options.extras_require]
video =
    opencv-python
    projectaria-tools
viewer =
    opencv-python
    rerun-sdk
soma =
    smplx
    newton==1.0.0
    warp-lang==1.12.0
    typing_extensions==4.15.0
    pyglet==2.1.13
    trimesh==4.11.3
    imgui-bundle==1.92.4
    usd-core==26.3
    chumpy==0.70
    cholespy==2.2.0
    rtree==1.4.1
gpu =
    %(soma)s
dev =
    pytest
    %(soma)s
