[metadata]
name = dataset-converter
version = 0.1.0
description = Dataset conversion utilities for HDF5/Xperience and Nymeria motion data.
long_description = file: README.md
long_description_content_type = text/markdown

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.11
install_requires =
    h5py
    numpy
    scipy
    tqdm

[options.packages.find]
where = src
include =
    dataset_converter*
    soma*

[options.entry_points]
console_scripts =
    dataset-converter-hdf5-batch = dataset_converter.hdf5.cli.batch_export:main
    dataset-converter-nymeria-batch = dataset_converter.nymeria.cli.batch_export:main

[options.extras_require]
soma =
    smplx
    torch
    trimesh
    warp-lang
gpu =
    %(soma)s
dev =
    pytest
    %(soma)s
